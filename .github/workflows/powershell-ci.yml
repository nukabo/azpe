name: PowerShell CI

on:
  push:
    paths:
      - 'powershell/**'
      - 'internal/catalog/**'
      - '.github/workflows/powershell-ci.yml'
  pull_request:
    paths:
      - 'powershell/**'
      - 'internal/catalog/**'
      - '.github/workflows/powershell-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-tests:
    name: PowerShell Compatibility Client Tests
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Module Manifest
        shell: powershell
        run: |
          Test-ModuleManifest -Path ./powershell/Azpe/Azpe.psd1 -ErrorAction Stop

      - name: Verify Standalone Script is Up To Date
        shell: pwsh
        run: |
          ./powershell/build.ps1 -GenerateOnly -OutDir $env:TEMP
          $expected = (Get-FileHash ./powershell/Invoke-AzpeProbe.ps1 -Algorithm SHA256).Hash
          $actual = (Get-FileHash "$env:TEMP/Invoke-AzpeProbe.ps1" -Algorithm SHA256).Hash
          if ($expected -ne $actual) {
            throw "Generated standalone script is out of date. Run powershell/build.ps1 to update."
          }
          Write-Host "Standalone script hash verification passed: $expected"

      - name: Test with Windows PowerShell 5.1
        shell: powershell
        run: |
          $PSVersionTable
          Install-Module Pester -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -Force
          Invoke-Pester -Path ./powershell/Tests -Output Detailed -CI

      - name: Test with PowerShell 7
        shell: pwsh
        run: |
          $PSVersionTable
          Install-Module Pester -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -Force
          Invoke-Pester -Path ./powershell/Tests -Output Detailed -CI

      - name: Build & Package Standalone Client
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ./dist -Force
          ./powershell/build.ps1 -SkipTests -OutDir ./dist

      - name: Verify Archive Package Artifacts
        shell: pwsh
        run: |
          $zipFiles = Get-ChildItem -Path ./dist -Filter "azpe-powershell_*.zip"
          if ($null -eq $zipFiles -or $zipFiles.Count -eq 0) {
            throw "Expected release artifact dist/azpe-powershell_*.zip was not found!"
          }
          Write-Host "Build and packaging succeeded: $($zipFiles[0].FullName)"
