name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: false
          cache: false

      - name: Download Go modules
        run: go mod download

      - name: Validate code formatting (gofmt)
        run: |
          UNFORMATTED=$(find . -name '*.go' -not -path './.gopath/*' -not -path './vendor/*' | xargs gofmt -s -l)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not formatted with gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run unit & integration tests
        run: go test -v -count=1 ./...

      - name: Run race detector
        run: go test -v -race ./...

      - name: Build binary
        run: go build -v -o azpe ./cmd/azpe

      - name: Test binary version & help
        run: |
          ./azpe --version
          ./azpe --help

      - name: Run GoReleaser check
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check

      - name: Run GoReleaser snapshot build
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean
