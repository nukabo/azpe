name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full repository history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@f111f37a573bc1f95242881341a470219a7745b4 # v5.3.0
        with:
          go-version: '1.22'
          check-latest: false
          cache: true

      - name: Run tests before release
        run: go test -v -count=1 ./...

      - name: Run go vet
        run: go vet ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@286f3bfee21b65c32d51208736adc61e368be897 # v6.0.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Artifact Attestations for Native Release Archives
        uses: actions/attest-build-provenance@1c607ba993da3431613c23a54b38d33d997f7422 # v1.4.3
        with:
          subject-path: 'dist/*.tar.gz,dist/*.zip,dist/checksums.txt'
