name: Feature request
description: Suggest an idea or enhancement for AZPE
title: '[ENHANCEMENT]: '
labels: ['enhancement']
assignees: ''

body:
  - type: markdown
    attributes:
      value: |
        AZPE's core principle is zero-login, unauthenticated diagnostic observation from the workload's execution environment. Feature requests should align with this core scope.

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or enhancement you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or workarounds considered.
